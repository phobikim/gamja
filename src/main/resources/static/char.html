<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no ">
    <title>감자단 키우기</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dex.css">
    <link rel="stylesheet" href="css/main_inventory.css">
    <link rel="stylesheet" href="css/rank.css">
    <link rel="stylesheet" href="css/quest.css">
    <link rel="stylesheet" href="css/bag.css">
    <link rel="stylesheet" href="css/station.css">
    <link rel="stylesheet" href="css/action.css">
    <link rel="stylesheet" href="css/attack.css">
</head>

<body class="char-page">

<!-- 🔵 상단 좌우 동그란 버튼 -->
<header class="header-ui">
</header>

<!-- 🟡 메인 UI 구조 -->
<main class="game-main-ui">

    <button id="mainBtn" class="circle-btn"></button>
    <div class="bgm-control">
        <input type="range" min="0" max="1" step="0.01" value="1" onchange="setBGMVolume(parseFloat(this.value))" class="bgm-slider" />
        <button id="bgmToggleBtn" class="bgm-off" style="background-image: url('http://211.208.163.16:51080/images/icons/bgm_off.png');"></button>
    </div>
    <!-- 🌕 배경 + 캐릭터 -->
    <section id="bgSceneArea" class="background-area">
        <img id="mainCharacter" src="http://211.208.163.16:51080/images/character/default.png" alt="캐릭터" class="character-img">
    </section>

    <!-- 🟢 캐릭터 정보 영역 -->
    <section class="status-ui">
        <p id="charInfoText" class="char-text">
            <span class="char-title" id="userTitle"></span>
            <span id="charName"></span>
            <span class="level-text">(LV <span id="charLevel" class="level-num"></span>)</span>
        </p>

        <div class="hp-bar">
            <div id="hpBarFill" class="hp-bar-fill" style="width: 0%;"></div>
        </div>
    </section>



    <!-- 🟠 인벤토리 -->
    <aside id="inventoryWrapper" class="inventory-grid">
        <!-- 액션 슬롯 -->
        <div class="inventoryCell" onclick="actionGather('FISHING')">
            <img src="http://211.208.163.16:51080/images/icons/icon_fish.png" alt="낚시">
            <span class="itemLabel">낚시터</span>
        </div>
        <div class="inventoryCell" onclick="actionGather('WOODCUTTING')">
            <img src="http://211.208.163.16:51080/images/icons/icon_wood.png" alt="벌목">
            <span class="itemLabel">벌목터</span>
        </div>
        <div class="inventoryCell" onclick="actionGather('MINING')">
            <img src="http://211.208.163.16:51080/images/icons/icon_mining.png" alt="광산">
            <span class="itemLabel">광산입구</span>
        </div>
        <div class="inventoryCell" onclick="actionGather('GATHERING')">
            <img src="http://211.208.163.16:51080/images/icons/icon_field.png" alt="밭">
            <span class="itemLabel">감자밭</span>
        </div>
        <!-- 기능 슬롯 -->
        <div class="inventoryCell" onclick="handleBagClick()">
            <img src="http://211.208.163.16:51080/images/icons/icon_bag.png" alt="배낭">
            <span class="itemLabel">인벤토리</span>
        </div>
        <div class="inventoryCell" onclick="handleStationClick()">
            <img src="http://211.208.163.16:51080/images/icons/icon_station.png" alt="공방">
            <span class="itemLabel">감자공방</span>
        </div>
        <div class="inventoryCell" onclick=showMessageModal("준비중입니다.")>
            <img src="http://211.208.163.16:51080/images/icons/icon_laboratory.png" alt="연구소">
            <span class="itemLabel">감자감정소</span>
        </div>
        <div class="inventoryCell" onclick="handleDexClick()">
            <img src="http://211.208.163.16:51080/images/icons/icon_book.png" alt="도감">
            <span class="itemLabel">도감</span>
        </div>

        <button id="attackButton" onclick="handleAttackClick()">
            <span>전투</span>
        </button>
    </aside>

    <!-- ⚫ 푸터 메뉴 영역 (추후 버튼 등) -->
    <footer id="footerNav" class="footer-ui">
    </footer>
</main>

<!-- 공통 장소 선택 모달 -->
<div id="spotSelectModal" class="modal hidden">
    <div class="spot-select-modal-content">
        <h2 class="common-h2-brown" id="spotSelectTitle">장소 선택</h2>
        <div id="userSkillInfo" class="skill-info">
            <!-- JS에서 동적으로 레벨, 경험치 삽입 -->
        </div>
        <div class="spot-list" id="spotButtonList">
            <!-- JS로 버튼이 동적으로 삽입됨 -->
        </div>
    </div>
</div>

<div id="activityModal" class="modal hidden">
    <div class="action-modal-content" id="activityModalContent">

        <div class="action-card-frame">

            <!-- 장소 이름: 상단 -->
            <div class="activity-location-name" id="activityLocationName">Mystic Pond</div>

            <!-- 가로 분할: 이미지 + 로그 -->
            <div class="action-card-body">
                <!-- 이미지 -->
                <div class="action-image-wrapper">
                    <img id="activityImage" class="action-image" src="" alt="" onclick="handleActivityClick()">
                    <div class="activity-click-tooltip">Click to gather!</div>
                </div>


                <!-- 오른쪽 정보 -->
                <div class="activity-right-info">
                    <div class="spot-info-title">Spot Info</div>
                    <ul class="spot-info-list">
                        <li>Recommended Lv. 3+</li>
                        <li>Time Bonus Active</li>
                        <li>Night Boost Zone</li>
                    </ul>
                </div>
                <!-- 드랍 로그 -->
<!--                <div class="action-log-wrapper">-->
<!--                    <div class="item-drop-title">Drops</div>-->
<!--                    <div class="item-drop-vertical-list" id="possibleItems"></div>-->
<!--                </div>-->
            </div>

        </div>

        <!-- 하단: 획득한 아이템 + 완료 버튼 -->
        <div class="action-info-section">
            <div class="item-gain-info">
                <div class="item-gain-title">Acquired Items</div>
                <div class="item-gain-list" id="gainedItems"></div>
            </div>
            <button class="action-complete-btn" onclick="completeActivity()">Complete</button>
        </div>

    </div>
</div>





<!-- 감자단 도감 모달 -->
<div id="dexModal" class="modal hidden">
    <div class="dex-modal-content">
        <!-- 카드 확대 오버레이 -->
        <div id="cardOverlay" class="card-overlay"></div>
        <h2 class="common-h2">COLLECTION</h2>
        <div id="dexList" class="dex-grid"></div>
        <div id="dexPagination" class="dex-pagination"></div>
    </div>
</div>

<template id="dexCardTemplate">
    <div class="dex-card">
        <div class="card-inner">
            <div class="card-front">
                <img src="" alt="" class="dex-img" draggable="false">
            </div>
            <div class="card-back">
                <p class="dex-name"></p>
                <div class="dex-body">
                    <p class="dex-rank"></p>
                    <p class="dex-condition"></p>
                    <button class="apply-btn" data-dexid="">적용하기</button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- 📌 메시지 모달 -->
<div id="messageModal" class="modal hidden">
    <div class="message-modal-content">
        <p id="messageText" class="message-text"></p>
        <button id="messageCloseBtn" class="finish-btn">확인</button>
    </div>
</div>

<!-- 랭크 모달 -->
<div id="rankModal" class="modal hidden">
    <div class="rank-modal-content">
        <h2 class="rank-title">랭킹</h2>
<!--        <h3 class="rank-subtitle" id="weekRange">집계기간: </h3>-->
<!--        <div id="rankList" class="rank-list"></div>-->
        <!-- 스크롤 되는 랭킹 리스트 -->
        <div id="rankScrollArea" class="rank-scroll-area">
            <div id="rankList" class="rank-list"></div>
        </div>
        <!-- 내 랭킹 정보 고정 표시 (필요한 경우에만 보임) -->
        <div id="myRankContainer" class="my-rank-container hidden"></div>
    </div>
</div>

<template id="rankItemTemplate">
    <div class="rank-item">
        <div class="rank-number"></div>
        <img class="rank-avatar" src="" alt="캐릭터 이미지">
        <div class="rank-info">
            <span class="rank-username">닉네임</span>
            <span class="rank-total">000 점</span>
        </div>
    </div>
</template>

<!-- 퀘스트 모달 -->
<div id="questModal" class="modal hidden">
    <div class="quest-modal-content">
        <div class="quest-header">
            <img src="/images/backgrounds/bg_quest_banner.png" alt="퀘스트 일러스트" class="quest-illust" />
        </div>
        <!-- 중간: 퀘스트 리스트 (스크롤 가능) -->
        <ul id="questList" class="quest-scroll-area">
            <!-- JS로 템플릿 복제 -->
        </ul>

        <!-- 하단: 초기화까지 남은 시간 -->
        <div class="quest-footer">
            초기화까지 남은 시간: <span id="questResetTime">5시간 00분</span>
        </div>
    </div>
</div>
<!-- 퀘스트 항목 템플릿 -->
<template id="questItemTemplate">
    <li class="quest-item">
        <!-- 왼쪽: 이미지 -->
        <div class="quest-image">
            <img src="" alt="퀘스트 이미지" />
        </div>

        <!-- 가운데: 퀘스트 정보 -->
        <div class="quest-center">
            <div class="quest-title"></div>
            <div class="quest-desc"></div>
            <div class="quest-meta">
                <span class="quest-difficulty"></span> ·
                <span class="quest-reward"></span>
            </div>
            <div class="quest-progress"></div>
        </div>

        <!-- 오른쪽: 완료 버튼 or 완료 표시 -->
        <div class="quest-right">
            <div class="quest-complete-area hidden">완료</div>
            <div class="quest-done hidden">완료됨</div>
        </div>
    </li>
</template>

<!-- 가방 모달 -->
<div id="bagModal" class="modal hidden">
    <div class="bag-modal-content">
        <div class="bag-tabs">
            <button data-type="ALL" class="active">전체</button>
            <button data-type="GATHER_MATERIAL">채집</button>
            <button data-type="CRAFT_MATERIAL">가공</button>
            <button data-type="COMPOSITE">합성</button>
            <button data-type="EQUIPMENT">장비</button>
        </div>
        <ul id="bagList" class="bag-grid">
            <!-- JS로 아이템 슬롯 채울 예정 -->
        </ul>
    </div>
</div>


<!-- 공방 모달 구조 -->
<div id="workshopModal" class="modal hidden">
    <div class="workshop-modal-content">
        <div class="workshop-left" id="workshop-category-list">
            <!-- 좌측 카테고리 목록 -->
        </div>
        <div class="workshop-right">
            <!-- 상단: 레시피 카드 리스트 -->
            <div id="recipe-card-list" class="recipe-card-list">
                <!-- JS로 카드 생성 -->
            </div>

            <!-- 하단: 상세 정보 + CRAFT 버튼 -->
            <div id="recipe-detail" class="recipe-detail">
                <div class="ingredient-scroll">
                    <!-- 여기에 재료 리스트 들어감 -->
                </div>

                <button class="craft-button">CRAFT</button>
            </div>
        </div>
    </div>
    <div id="craft-effect-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
</div>

<!-- 전투 모달 -->
<div id="battleModal" class="modal hidden">
    <div class="battle-modal-content">
        <!-- 전투 장면 -->
        <div class="battle-scene">
            <img src="http://211.208.163.16:51080/images/backgrounds/bg_attack_scene2.png" alt="전투 씬">

            <!-- 🟢 플레이어 영역 -->
            <div class="player-container">
                <div class="char-shadow"></div>
                <img id="userCharacter" class="player-character" src="" alt="내 캐릭터">
            </div>

            <!-- 🔴 몬스터 영역 -->
            <div class="monster-container">
                <div class="char-shadow"></div>
                <img id="monsterCharacter" class="monster-character" src="" alt="몬스터">
            </div>
        </div>
        <div class="battle-log" id="battleLog">
        </div>

        <div class="battle-stats" id="battleStats" >
            <!-- 유저 카드 -->
            <div class="stat-card user-stats">
                <div class="card-head">
                    <strong class="user-name">유저이름</strong>
                </div>
                <div class="card-body">
                    Lv.<span class="user-level">0</span><br>
                    공격력: <span class="user-power">0</span><br>
                    HP: <span class="user-hp">0</span><br>
                </div>
            </div>

            <!-- 몬스터 카드 -->
            <div class="stat-card monster-stats">
                <div class="card-head">
                    <strong class="monster-name">몬스터이름</strong>
                </div>
                <div class="card-body">
                    Lv. <span class="monster-rank">0</span><br>
                    공격력: <span class="monster-power">0</span><br>
                    처치 경험치: <span class="monster-xp">0</span><br>
                    HP: <span class="monster-hp">0</span><br>
                </div>
            </div>
        </div>
        <!-- 드랍 아이템 영역 (가로 전체) -->
        <div class="battle-drops">
            <span class="drop-label" >드랍 아이템</span>
            <div class="monster-drops"></div>
        </div>
        <div id="itemTooltip" class="item-tooltip hidden"></div>
        <div class="battle-actions">
            <button onclick="doAttack()">
                <img src="http://211.208.163.16:51080/images/icons/icon_skill_attack.png" alt="공격">
            </button>
<!--            <button onclick="doDefend()">-->
<!--                <img src="http://211.208.163.16:51080/images/icons/icon_skill_shied.png" alt="방어">-->
<!--            </button>-->
            <button onclick="doHeal()">
                <img src="http://211.208.163.16:51080/images/icons/icon_skill_heal.png" alt="회복">
            </button>
        </div>
    </div>
</div>

</body>
</html>

<script src="js/modal.js"></script>
<script src="js/sound.js"></script>
<script src="js/util.js"></script>
<script src="js/char.js"></script>

<!--<script src="js/quest.js"></script>-->
<script src="js/bag.js"></script>
<script src="js/station.js"></script>
<script src="js/dex.js"></script>
<script src="js/action.js"></script>
<script src="js/attack.js"></script>
