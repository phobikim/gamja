<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보스 전투</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/bossBattle.css">
</head>
<body class="boss-battle-page">
<div class="boss-battle-wrapper">

    <!-- 배경 이미지 (2/3) -->
    <div class="boss-background">
        <img src="https://phobi.my/gamja.img/images/battle/boss_map2.png" alt="보스 전투 배경" class="boss-map-img">

        <!-- 보스 체력바 -->
        <div class="boss-hp-bar">
            <div class="boss-hp-bar-bg">
                <div class="boss-hp-bar-fill" style="width: 100%;"></div>
            </div>
            <div class="boss-name">보스 GG</div>
        </div>

        <div class="boss-hp-text" id="bossHpText">5000 / 5000</div>
        <!-- 보스 대사 -->
        <div class="boss-dialogue-box" id="bossDialogue"></div>

        <!-- 보스 이미지 -->
        <div class="boss-image-wrapper">
            <img src="https://phobi.my/gamja.img/images/battle/boss_gg2.png" alt="보스 GG" class="boss-image">
        </div>

        <!-- 왼쪽 캐릭터 (기존) -->
        <div class="character-left-wrapper" id="characterLeftWrapper">
            <div class="char-image-container">
                <div class="char-status-box">
                    <div class="char-hp-bar">
                        <div class="char-hp-fill" style="width: 80%;"></div>
                    </div>
                    <div class="char-hp-text">100 / 100</div>
                </div>
                <img src="" class="character-left" />
            </div>
            <div class="char-name-label">플레이어</div>
        </div>

        <!-- 오른쪽 캐릭터 (전투 도중 등장) -->
        <div class="character-right-wrapper hidden" id="characterRightWrapper">
            <div class="char-image-container">
                <div class="ally-dialogue-box" id="allyDialogue" aria-live="polite"></div>
                <img src="" class="character-right" />
            </div>
            <div class="char-name-label" id="allyName">조력자</div>
        </div>
    </div>


    <!-- 하단 영역: 버튼들 -->
    <div class="player-battle-area">
        <!-- 버튼들 -->
        <div class="battle-button-row">
            <button class="battle-btn" id="runAwayBtn">도망</button>
            <button class="battle-btn btn-attack" id="attackBtn">공격</button>
            <div class="potion-slot btn-potion" role="button" aria-label="포션 사용">
                <div class="potion-img-wrap">
                    <img class="potion-img" src="" alt="포션">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/util.js"></script>
<script src="js/sound.js"></script>
<script src="js/modal.js"></script>
<script src="js/bossBattle.js"></script>

</body>
</html>
