<!-- modals.html -->

<!-- 낚시 모달 -->
<div id="fishingModal" class="modal hidden">
    <div class="modal-content action-modal fish">
        <img id="fishImage" src="images/content/fish.png" alt="물고기" class="action-img">
        <div class="fishing-bottom">
            <button id="finishFishingBtn" class="finish-btn">완료</button>
        </div>
    </div>
</div>

<!-- 벌목 모달 -->
<div id="woodModal" class="modal hidden">
    <div class="modal-content action-modal wood">
        <img id="woodImage" src="./images/content/wood.png" alt="나무" class="action-img">
        <div class="fishing-bottom">
            <button id="finishWoodBtn" class="finish-btn">완료</button>
        </div>
    </div>
</div>

<!-- 채광 모달 -->
<div id="stoneModal" class="modal hidden">
    <div class="modal-content action-modal stone">
        <img id="stoneImage" src="./images/content/stone.png" alt="돌" class="action-img">
        <div class="fishing-bottom">
            <button id="finishStoneBtn" class="finish-btn">완료</button>
        </div>
    </div>
</div>

<!-- 요리 모달 -->
<div id="cookModal" class="modal hidden">
    <div class="modal-content action-modal cook">
        <img id="cookImage" src="./images/content/cook.png" alt="요리" class="action-img">
        <div class="fishing-bottom">
            <button id="finishCookBtn" class="finish-btn">완료</button>
        </div>
    </div>
</div>

<!-- 상점 모달 -->
<div id="shopModal" class="modal hidden">
    <div class="modal-content shop-modal-content">
        <div class="shop-left">
            <img src="./images/content/shop_day.png" alt="상점 배경" class="shop-background-img">
        </div>
        <div class="shop-right">
            <h2>구매 가능 아이템</h2>
            <div id="shopGold" class="shop-gold">보유 재화: 0 골드</div>
            <ul id="shopItemList" class="shop-item-list"></ul>
            <button id="closeShopBtn" class="finish-shop-btn">닫기</button>
        </div>
    </div>
</div>
