<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>감자단 입장</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="intro-page">

    <div class="logo-container">
        <img id="gamjadanLogo" src="https://phobi.me/gamja.img/images/logo/logo.png" alt="감자단 로고" class="logo-img">
<!--        <img id="gamjadanLogo" src="https://phobi.me/gamja.img/images/character/감구리.png" alt="감자단 로고" class="logo-img">-->
        <p class="click-guide">👆 로고를 클릭해 로그인하세요</p>
    </div>

    <!-- 로그인 모달 -->
    <div id="adminModal" class="modal hidden">
        <div class="pin-modal-content">
            <h2>로그인</h2>
            <input type="text" id="LoginUsernameInput" placeholder="이름 입력">
            <div class="pin-input-group">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
            </div>

            <p id="adminErrorText" class="error-text hidden"></p>
            <button id="adminEnterBtn" >입장하기</button>
            <button id="openSignupBtn">회원가입</button>
        </div>
    </div>

    <!-- 회원가입 모달 -->
    <div id="signupModal" class="modal hidden">
        <div class="pin-modal-content">
            <h2>감자단 가입</h2>
            <input type="text" maxlength="10" id="signupUsernameInput" placeholder="이름 입력">
            <div class="pin-input-group">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="pin-input" inputmode="numeric" pattern="[0-9]*">
            </div>
            <p id="signupErrorText" class="error-text hidden"></p>
            <button id="signupSubmitBtn">가입하기</button>
            <button id="closeSignupBtn">취소</button>
        </div>
    </div>

    <!-- 성공 모달 -->
    <div id="successModal" class="modal hidden">
        <div class="success-modal-content">
            <h2 id="successModalTitle">🎉 성공!</h2>
            <p id="successModalMessage"></p>
            <button id="successModalBtn">확인</button>
        </div>
    </div>

<footer class="footer-copyright">
    <div>© 2025 Gamjadan. All rights reserved.</div>
    <div>Creator: PHOBI | Version: v1.0.0</div>
</footer>

</body>

</html>
<script src="js/sound.js"></script>
<script src="js/util.js"></script>
<script src="js/index.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
                .then(registration => {
                    console.log('ServiceWorker 등록 성공:', registration);
                })
                .catch(error => {
                    console.log('ServiceWorker 등록 실패:', error);
                });
        });
    }
</script>
