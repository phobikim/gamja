<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감자단 캐릭터 페이지</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="char-page">

<!-- 🔵 상단 좌우 동그란 버튼 -->
<header class="header-ui">
    <button id="mainBtn" class="circle-btn"></button>
    <button id="bgmToggleBtn" class="bgm-off"></button>
</header>

<!-- 🟡 메인 UI 구조 -->
<main class="game-main-ui">

    <!-- 🌕 배경 + 캐릭터 -->
    <section id="bgSceneArea" class="background-area">
        <img id="mainCharacter" src="./images/character/default.png" alt="캐릭터" class="character-img">
    </section>

    <!-- 🟢 캐릭터 정보 영역 -->
    <section class="status-ui">
        <p id="charInfoText" class="char-text">
            <span id="charName"></span>
            <span class="level-text">(LV <span id="charLevel" class="level-num"></span>)</span>
        </p>
        <p class="char-title" id="userTitle"></p>
        <div class="hp-bar">
            <div id="hpBarFill" class="hp-bar-fill" style="width: 0%;"></div>
        </div>
    </section>


    <!-- 🟠 인벤토리 -->
    <aside id="inventoryWrapper" class="inventory-grid">
        <div class="inventoryCell">
            <img src="./images/items/i_fish.png" alt="물고기">
            <span id="itemFish" class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="/images/items/i_wood.png" alt="나무">
            <span id="itemWood" class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="./images/items/i_stone.png" alt="돌">
            <span id="itemStone" class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="./images/items/i_food.png" alt="음식">
            <span id="itemFood" class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="./images/items/i_money.png" alt="돈">
            <span id="itemMoney" class="itemAmount">0</span>
        </div>
        <!-- 필요 시 여분 슬롯 추가 -->
        <div class="inventoryCell">
            <img src="./images/items/i_empty.png" alt="빈칸">
            <span class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="./images/items/i_empty.png" alt="빈칸">
            <span class="itemAmount">0</span>
        </div>
        <div class="inventoryCell">
            <img src="./images/items/i_empty.png" alt="빈칸">
            <span class="itemAmount">0</span>
        </div>
    </aside>

    <!-- ⚫ 푸터 메뉴 영역 (추후 버튼 등) -->
    <footer id="footerNav" class="footer-ui">
        <!-- 예: <button>홈</button> <button>지도</button> -->
    </footer>
</main>

<!-- 감자단 도감 모달 -->
<div id="dexModal" class="modal hidden">
    <div class="modal-content dex-modal-content">
        <!-- 카드 확대 오버레이 -->
        <div id="cardOverlay" class="card-overlay"></div>
        <h2>COLLECTION</h2>
        <div id="dexList" class="dex-grid"></div>
        <div id="dexPagination" class="dex-pagination"></div>
    </div>
</div>

<template id="dexCardTemplate">
    <div class="dex-card">
        <div class="card-inner">
            <div class="card-front">
                <img src="" alt="" class="dex-img" draggable="false">
            </div>
            <div class="card-back">
                <p class="dex-name"></p>
                <div class="dex-body">
                    <p class="dex-rank"></p>
                    <p class="dex-condition"></p>
                    <button class="apply-btn" data-dexid="">적용하기</button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- 📌 메시지 모달 -->
<div id="messageModal" class="modal hidden">
    <div class="modal-content message-modal-content">
        <p id="messageText" class="message-text"></p>
        <button id="messageCloseBtn" class="finish-btn">확인</button>
    </div>
</div>

</body>
</html>

<script src="js/modal.js"></script>
<script src="js/sound.js"></script>
<script src="js/util.js"></script>
<script src="js/char.js"></script>
